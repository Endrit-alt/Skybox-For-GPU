plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

// The experimental GPU API/client must be built separately; it is not bundled here.
def runeLiteVersion = findProperty('runeLiteVersion') ?: '1.13.6'
def gpuApiProject = file(findProperty('gpuApiProject') ?: '../runelite')
def gpuApiJar = file("${gpuApiProject}/runelite-client/build/libs/client-${runeLiteVersion}.jar")
def runeLiteApiJar = file("${gpuApiProject}/runelite-api/build/libs/runelite-api-${runeLiteVersion}.jar")

dependencies {
	compileOnly files(gpuApiJar, runeLiteApiJar)
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
}

group = 'com.endrit.gpusky'
version = '1.0-SNAPSHOT'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}
